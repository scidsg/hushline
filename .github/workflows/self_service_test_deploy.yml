        env:
          APP_URL: https://hushline.foo
        run: |
          set -euo pipefail
          health_url="${APP_URL%/}/health.json"
          for attempt in $(seq 1 240); do
            if curl --fail --silent --show-error --max-time 15 "$health_url" >/dev/null; then exit 0; fi
            echo "Waiting for staging health check (${attempt}/240)"
            sleep 10
          done
          exit 1

