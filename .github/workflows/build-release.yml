name: Build release container image
permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Make sure the version string matches the tag
        run: |
          HUSHLINE_VERSION=$(cut -d'"' -f2 hushline/version.py)
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_VERSION#v} # strip the leading 'v' from the tag
          if [ "$HUSHLINE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=hushline/version.py,title=Version check failed::Version string in hushline/version.py $HUSHLINE_VERSION does not match the tag $TAG_VERSION"
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: release_image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/hushline:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/hushline:release
            scidsg/hushline:${{ github.ref_name }}
            scidsg/hushline:release
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/hushline:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ github.repository }}/hushline:buildcache,mode=max

      - name: Record immutable release image
        env:
          RELEASE_IMAGE_DIGEST: ${{ steps.release_image.outputs.digest }}
          RELEASE_IMAGE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import json, os, re
          digest = os.environ["RELEASE_IMAGE_DIGEST"]
          if not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
              raise SystemExit("Missing immutable release image digest")
          with open("release-image.json", "w") as output:
              json.dump({"tag": os.environ["RELEASE_IMAGE_TAG"], "source_sha": os.environ["GITHUB_SHA"], "digest": digest, "image": "ghcr.io/scidsg/hushline/hushline"}, output)
          PYTHON
      - name: Preserve release image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single-tenant-release-image
          path: release-image.json
          if-no-files-found: error
          retention-days: 90
