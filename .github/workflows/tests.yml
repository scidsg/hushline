---
name: Run Linter and Tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - codex/epic-2365

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies for OpenPGP interoperability tests
        run: npm ci

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: "poetry"

      - name: Install Python dependencies
        run: poetry install

      - name: Lint
        run: poetry run make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies for OpenPGP interoperability tests
        run: npm ci

      - name: Pull compose dependency images
        run: |
          for attempt in 1 2 3 4 5; do
            if docker compose pull postgres blob-storage; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Test
        run: make test PYTEST_ADDOPTS="--skip-local-only"

  test-with-alembic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies for OpenPGP interoperability tests
        run: npm ci

      - name: Pull compose dependency images
        run: |
          for attempt in 1 2 3 4 5; do
            if docker compose pull postgres blob-storage; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Test with alembic
        run: make test
        env:
          PYTEST_ADDOPTS: "--alembic --skip-local-only"

  pqc-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - run: npx playwright install --with-deps chromium
      - name: Test compiled PQC browser encryption under CSP
        run: npm run playwright:e2ee -- pqc.spec.js

  pq-browser-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Test encrypted transactional browser state
        run: npm run playwright:pq-state

  pq-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Test hybrid handshake and continuous PQ ratchet
        run: npm run playwright:pq-protocol -- --project=${{ matrix.project }}

  pq-ratchet-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-engine
          - firefox-engine
          - webkit-engine
    defaults:
      run:
        working-directory: prototypes/pq-ratchet
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototypes/pq-ratchet/package-lock.json
      - run: npm ci
      - run: mkdir -p artifacts
      - name: Verify the reviewed WASM artifact
        run: npm run provenance > artifacts/provenance.json
      - name: Generate the dependency SBOM
        run: npm sbom --sbom-format cyclonedx > artifacts/sbom.cdx.json
      - name: Audit prototype dependencies
        run: npm audit --package-lock-only --json > artifacts/npm-audit.json
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Measure synthetic PQ ratchet behavior and budgets
        run: npm test -- --project=${{ matrix.project }}
      - name: Upload non-secret protocol evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pq-ratchet-${{ matrix.project }}-${{ github.sha }}
          path: |
            prototypes/pq-ratchet/artifacts
            prototypes/pq-ratchet/test-results
          if-no-files-found: error
          retention-days: 14

  pq-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - webkit-mobile-emulation
    env:
      PQ_CHAT_AUTO_MIGRATION_ENABLED: "true"
      PQ_CHAT_MIGRATION_ROLLOUT_PERCENT: "100"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - name: Start synthetic integrated candidate
        run: |
          docker compose up -d postgres blob-storage
          attempt=0
          until curl -fsS http://localhost:4566/_localstack/health | grep -Eq 'running|available'; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              docker compose logs blob-storage
              exit 1
            fi
            sleep 2
          done
          docker compose run --rm dev_data
          docker compose up -d app
          make runner-wait-for-app
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Test integrated protected delivery and exact-byte retry
        run: npm run playwright:pq-delivery -- --project=${{ matrix.project }}
      - name: Record exact synthetic candidate identity
        if: ${{ !cancelled() }}
        run: node scripts/pq_validation_manifest.mjs
      - name: Upload synthetic browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pq-delivery-${{ matrix.project }}-${{ github.sha }}
          path: test-results/pq-delivery
          if-no-files-found: error
          retention-days: 14
