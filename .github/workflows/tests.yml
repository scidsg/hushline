---
name: Run Linter and Tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies for OpenPGP interoperability tests
        run: npm ci

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: "poetry"

      - name: Install Python dependencies
        run: poetry install

      - name: Lint
        run: poetry run make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies for OpenPGP interoperability tests
        run: npm ci

      - name: Pull compose dependency images
        run: |
          for attempt in 1 2 3 4 5; do
            if docker compose pull postgres blob-storage; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Test
        run: make test PYTEST_ADDOPTS="--skip-local-only"

  test-with-alembic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies for OpenPGP interoperability tests
        run: npm ci

      - name: Pull compose dependency images
        run: |
          for attempt in 1 2 3 4 5; do
            if docker compose pull postgres blob-storage; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Test with alembic
        run: make test
        env:
          PYTEST_ADDOPTS: "--alembic --skip-local-only"

  pqc-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - run: npx playwright install --with-deps chromium
      - name: Test compiled PQC browser encryption under CSP
        run: npm run playwright:e2ee -- pqc.spec.js
