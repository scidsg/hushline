name: Lighthouse Accessibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:prod

      - name: Start app
        run: |
          docker compose up -d postgres blob-storage
          attempt=0
          until curl -fsS http://localhost:4566/_localstack/health | grep -Eq 'running|available'; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              echo "blob-storage did not become ready."
              docker compose logs blob-storage
              exit 1
            fi
            sleep 2
          done

          for i in 1 2 3; do
            if docker compose run --rm dev_data; then
              break
            fi

            if [ "$i" -eq 3 ]; then
              echo "dev_data failed after ${i} attempts."
              docker compose logs blob-storage
              exit 1
            fi
            sleep $((i * 5))
          done

          docker compose up -d app
          attempt=0
          until curl -fsS http://localhost:8080/ > /dev/null; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              break
            fi
            sleep 2
          done

      - name: Run Lighthouse
        run: |
          for i in 1 2 3; do
            if docker run --rm --network host --shm-size=1g \
              femtopixel/google-lighthouse \
              http://localhost:8080 \
              --only-categories=accessibility \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu" \
              --output=json \
              --output-path=stdout \
              --quiet > lighthouse.json; then
              break
            fi

            if [ "$i" -eq 3 ]; then
              echo "Lighthouse accessibility failed after ${i} attempts."
              exit 1
            fi
            sleep $((i * 5))
          done

      - name: Extract score
        run: |
          SCORE=$(python3 -c "import json; from pathlib import Path; data=json.loads(Path('lighthouse.json').read_text()); print(round(data['categories']['accessibility']['score'] * 100))")
          if [ "$SCORE" -ne 100 ]; then
            echo "Accessibility score must be 100, got $SCORE"
            exit 1
          fi

      - name: Upload accessibility evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lighthouse-accessibility-${{ github.sha }}
          path: lighthouse.json
          if-no-files-found: error
          retention-days: 14
